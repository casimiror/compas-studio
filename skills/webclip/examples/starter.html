<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>webclip starter</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;}
  body{display:flex;align-items:center;justify-content:center;}
  #stage{
    position:relative;width:1080px;height:1920px;background:#0A0E17;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:-apple-system,"Segoe UI",sans-serif;
  }
  .mark{
    width:260px;height:260px;border-radius:50%;background:#3DD598;
    display:flex;align-items:center;justify-content:center;
    font-size:140px;font-weight:800;color:#0A0E17;
    transform:scale(0);opacity:0;
  }
  .headline{
    margin-top:50px;font-size:64px;font-weight:800;color:#F5F5F5;opacity:0;transform:translateY(30px);
    text-align:center;padding:0 60px;
  }
  .sub{
    margin-top:20px;font-size:34px;color:#B8BDC9;opacity:0;
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="mark" id="mark">C</div>
    <div class="headline" id="headline">Tu marca, en movimiento</div>
    <div class="sub" id="sub">hecho con webclip</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    // Finite, single-cycle timeline — this is what gets exported.
    const tl = gsap.timeline({ paused: true });
    tl.to('#mark', { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(3)' }, 0.1)
      .to('#headline', { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 0.7)
      .to('#sub', { opacity: 1, duration: 0.35 }, 1.1)
      .to('#stage', { opacity: 0, duration: 0.4 }, 3.4);

    window.__clip = tl;

    // Preview-only loop — drives tl via .seek(), never .play()/.restart(), and stops
    // the instant render.mjs sets window.__renderMode (composition-contract.md).
    (function previewLoop(startTime) {
      if (window.__renderMode) return;
      const elapsed = (performance.now() - startTime) / 1000 % tl.duration();
      tl.seek(elapsed);
      requestAnimationFrame(() => previewLoop(startTime));
    })(performance.now());
  </script>
</body>
</html>
